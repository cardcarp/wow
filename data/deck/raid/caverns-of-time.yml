description:
  - title: The Experience
    body: Face off against the Infinite Dragonflight in a fully co-op, 1–5 player raid experience.
  - title: The Mastermind
    body: Battle against Murozond and other iconic villains.
  - title: Components
    body: Includes a complete 110-card Encounter Deck, Oversized Raid Hero Cards, and Treasure Packs.
  - title: Why It Matters
    body: This is the ultimate "boss battle" experience that brings the MMO raid experience to the tabletop, making it a highly collectible, out-of-print item.

